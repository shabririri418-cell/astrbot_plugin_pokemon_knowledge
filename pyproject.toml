[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-offline-knowledge"
version = "1.0.0"
description = "Offline XML/ZIM Pokemon knowledge retrieval with an AstrBot adapter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "shabririri418-cell"}]
dependencies = []

[project.optional-dependencies]
build = ["beautifulsoup4==4.15.0", "lxml==6.1.3", "libzim==4.1.0", "opencc-python-reimplemented==0.1.7"]

[project.urls]
Repository = "https://github.com/shabririri418-cell/astrbot_plugin_pokemon_knowledge"

[tool.setuptools.packages.find]
include = ["pokemon_knowledge*"]
